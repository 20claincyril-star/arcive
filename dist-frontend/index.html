<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcive</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Segoe UI, Arial, sans-serif;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 1120px;
        margin: 2rem auto;
        padding: 0 1.25rem 2.5rem;
      }
      h1 {
        margin: 0 0 0.4rem;
      }
      h3 {
        margin: 0;
      }

      .grid {
        display: grid;
        gap: 0.85rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid > * {
        min-width: 0;
      }
      .grid.align-end {
        align-items: end;
      }
      .grid.align-center {
        align-items: center;
      }
      .grid.uniform-buttons {
        align-items: stretch;
      }

      .card-grid {
        display: grid;
        gap: 1rem;
      }
      .card-grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .card-grid.two > * {
        min-width: 0;
      }

      .input-with-action {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.5rem;
        align-items: end;
      }
      .input-with-action > button {
        width: auto;
        min-width: 120px;
        padding-inline: 1rem;
        white-space: nowrap;
      }

      .card {
        background: #111827;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 1rem;
        min-width: 0;
      }
      .section-gap {
        margin-top: 1rem;
      }
      .card > h3 + * {
        margin-top: 0.9rem;
      }

      .row {
        margin-bottom: 0.75rem;
        min-width: 0;
      }
      .row:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.9rem;
      }
      input,
      button {
        width: 100%;
        border-radius: 8px;
        border: 1px solid #334155;
        padding: 0.62rem 0.72rem;
        background: #0b1222;
        color: #e2e8f0;
        min-width: 0;
        min-height: 40px;
      }
      button {
        background: #2563eb;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.62;
        cursor: not-allowed;
      }
      .arcive-busy {
        cursor: progress;
      }

      .list {
        margin-top: 0.9rem;
        min-width: 0;
      }
      .item {
        border-top: 1px solid #334155;
        padding: 0.65rem 0;
        overflow-wrap: anywhere;
      }
      .muted {
        color: #94a3b8;
        font-size: 0.9rem;
      }
      #status {
        margin: 0.8rem 0;
        color: #93c5fd;
        min-height: 1.25rem;
      }
      .danger {
        background: #b91c1c;
      }

      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
      }
      .app-header h1 {
        margin: 0 0 0.35rem;
      }
      .app-header-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .app-header-actions label {
        margin: 0;
        font-size: 0.85rem;
      }
      .app-header-actions select,
      .app-header-actions #btnHelp {
        width: auto;
        min-width: 4rem;
        padding: 0.45rem 0.65rem;
        min-height: 36px;
      }
      .app-header-actions #btnHelp {
        font-weight: 700;
        border-radius: 50%;
        min-width: 36px;
        padding: 0;
      }
      .help-panel {
        margin-top: 1rem;
      }
      .help-panel h2 {
        margin: 0 0 0.75rem;
      }
      .help-panel h3 {
        margin: 1rem 0 0.35rem;
      }
      .help-panel p {
        margin: 0 0 0.5rem;
        color: #cbd5e1;
      }
      .hidden {
        display: none !important;
      }

      .danger:hover {
        background: #991b1b;
      }

      @media (max-width: 980px) {
        .grid,
        .card-grid.two {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 620px) {
        main {
          padding: 0 0.75rem 1.5rem;
        }
        .card {
          padding: 0.85rem;
        }
        .input-with-action {
          grid-template-columns: 1fr;
        }
        .input-with-action > button {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-Db00crEL.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>Arcive Desktop</h1>
      <p class="muted">MVP local: init, import, list, search via moteur chiffré.</p>
      <div id="status">Prêt.</div>
    </main>
  </body>
</html>
